name: v1.4 Hotfix Image

on:
  # This maintenance workflow publishes and then smoke-tests the v1.4 hotfix
  # without creating a GitHub Release or moving the original v1.4.0 tag.
  push:
    branches: [release/v1.4]
    paths:
      - '.github/workflows/v1.4-hotfix-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v1.4-hotfix-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v1.4 maintenance branch
        uses: actions/checkout@v7
        with:
          ref: release/v1.4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push v1.4 hotfix image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/opsknight:1.4.0-hotfix
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true

  compose-smoke:
    name: Docker Compose smoke test
    needs: build-and-push
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout v1.4 maintenance branch
        uses: actions/checkout@v7
        with:
          ref: release/v1.4

      - name: Prepare isolated Compose environment
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          POSTGRES_USER=opsknight
          POSTGRES_PASSWORD=7d572c2f4ab54eaf9b01891f4168633c
          POSTGRES_DB=opsknight_db
          POSTGRES_PORT=5432
          APP_PORT=3000
          NEXTAUTH_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NEXTAUTH_SECRET=smoke-test-nextauth-secret-0123456789abcdef
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OPSKNIGHT_IMAGE=ghcr.io/opsknight-labs/opsknight:1.4.0-hotfix
          EOF
          docker compose config > /tmp/opsknight-compose-resolved.yml
          grep -q 'ghcr.io/opsknight-labs/opsknight:1.4.0-hotfix' /tmp/opsknight-compose-resolved.yml

      - name: Pull and start full Compose stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Verify hotfix image and readiness
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(docker compose ps -q opsknight-app)"
          test -n "$APP_ID"
          IMAGE="$(docker inspect "$APP_ID" --format '{{.Config.Image}}')"
          echo "Running image: $IMAGE"
          test "$IMAGE" = 'ghcr.io/opsknight-labs/opsknight:1.4.0-hotfix'

          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail 'http://localhost:3000/api/health?mode=readiness' > /tmp/readiness.json; then
              ready=1
              break
            fi
            echo "Waiting for OpsKnight readiness ($attempt/60)..."
            sleep 5
          done

          if [ "$ready" -ne 1 ]; then
            echo 'OpsKnight did not become ready in time.'
            docker compose ps
            docker compose logs --no-color --tail=300 opsknight-app
            docker compose logs --no-color --tail=200 opsknight-db
            exit 1
          fi

          cat /tmp/readiness.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/readiness.json','utf8')); if(r.status!=='healthy') process.exit(1)"
          curl --silent --show-error --fail --location 'http://localhost:3000/setup' -o /tmp/setup.html
          test -s /tmp/setup.html

      - name: Check application logs for v1.4 advisory-lock regression
        shell: bash
        run: |
          set -euo pipefail
          docker compose logs --no-color opsknight-app | tee /tmp/opsknight-app.log
          if grep -Fq "Failed to deserialize column of type 'void'" /tmp/opsknight-app.log; then
            echo 'Detected Prisma PostgreSQL void-deserialization regression.'
            exit 1
          fi
          if grep -Fq '[DbLocks] pg_advisory_xact_lock failed' /tmp/opsknight-app.log; then
            echo 'Detected advisory-lock acquisition failure.'
            exit 1
          fi

      - name: Show final Compose state
        if: always()
        run: docker compose ps || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
