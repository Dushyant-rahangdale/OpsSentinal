name: v1.4 Hotfix Image

on:
  # The one-time path trigger lets this workflow publish from the v1.4
  # maintenance branch without creating a GitHub Release or retagging v1.4.0.
  push:
    branches: [release/v1.4]
    paths:
      - '.github/workflows/v1.4-hotfix-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v1.4-hotfix-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v1.4 maintenance branch
        uses: actions/checkout@v7
        with:
          ref: release/v1.4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push v1.4 hotfix image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/opsknight:1.4.0-hotfix
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true
